<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21D0B2" />
      <stop offset="100%" stop-color="#00C4E6" />
    </linearGradient>
  </defs>

  <!-- Connecting Angle Path -->
  <path d="M 60 22 L 15 50 L 60 78" 
        fill="none" 
        stroke="url(#cyanGradient)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Top Square Node -->
  <rect x="52" y="10" width="24" height="24" 
        fill="white" 
        stroke="url(#cyanGradient)" 
        stroke-width="7" 
        rx="2" />

  <!-- Bottom Square Node -->
  <rect x="52" y="66" width="24" height="24" 
        fill="white" 
        stroke="url(#cyanGradient)" 
        stroke-width="7" 
        rx="2" />
</svg>
