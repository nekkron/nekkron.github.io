<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-error: #f85149;
            --accent-hover: #da3633;
            --status-bg: rgba(248, 81, 73, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .image-wrapper {
            position: relative;
            max-width: 340px;
            margin: 0 auto 1.5rem;
            background-color: #ffffff;
            padding: 12px;
            border-radius: 16px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--accent-error);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 25px rgba(248, 81, 73, 0.3);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--status-bg);
            color: var(--accent-error);
            padding: 0.35rem 0.85rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .alert-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-error);
            border-radius: 50%;
            animation: blink 1.2s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-error);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="image-wrapper">
            <img src="https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcQ_A3Cc9F3zBb9lyg38kzchp1iQ9y_jx8hgI1KfEzM_rCDq7RYoLzwyy-Kv0KDQfBEPL8Ventb3d6_yrPA" alt="Semi-broken robot technician attempting to repair a damaged computer screen">
        </div>
        
        <div class="badge">
            <span class="alert-dot"></span> Unexpected Exception
        </div>

        <div class="error-code">500</div>
        <h1>Internal Server Error</h1>
        <p>Something went wrong on our end while processing your request. Our repair bot has been dispatched to diagnose and patch the underlying glitch.</p>

        <div class="btn-group">
            <button onclick="window.location.reload()" class="btn btn-primary">Try Again</button>
            <a href="/" class="btn btn-secondary">Return Home</a>
        </div>
    </main>

</body>
</html>
