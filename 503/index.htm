    <meta charset="UTF-8">

    <title>503 - Service Unavailable</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-warning: #f59e0b;
            --accent-hover: #d97706;
            --status-bg: rgba(245, 158, 11, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .image-wrapper {
            position: relative;
            max-width: 320px;
            margin: 0 auto 1.5rem;
            background-color: #ffffff;
            padding: 12px;
            border-radius: 16px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--accent-warning);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--status-bg);
            color: var(--accent-warning);
            padding: 0.35rem 0.85rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-warning);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-warning);
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="image-wrapper">
            <img src="https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcRFOijYGsNjIcZNJ8qw8pHKgV42043P0mtzZ_FwgK0BAtdvpHuYOlQSaNx6XPBMs4JotrFq9RfOPOR4uZk" alt="Robot medic technician repairing damaged laptop computer">
        </div>
        
        <div class="badge">
            <span class="pulse-dot"></span> Maintenance in Progress
        </div>

        <div class="error-code">503</div>
        <h1>Service Temporarily Unavailable</h1>
        <p>Our automated systems are currently undergoing emergency repairs or server capacity adjustments. Please try refreshing the page in a few moments.</p>

        <div class="btn-group">
            <button onclick="window.location.reload()" class="btn btn-primary">Refresh Page</button>
            <a href="/" class="btn btn-secondary">Return Home</a>
        </div>
    </main>

</body>
</html>
