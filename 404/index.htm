    <meta charset="UTF-8">

    <title>404 - Page Not Found</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .image-wrapper {
            position: relative;
            max-width: 320px;
            margin: 0 auto 1.5rem;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="image-wrapper">
            <img src="https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcTavzYQyMEqIwq8lDISEJQ3aBvItoZAgUE7xugVlKN1yCEOgaTvEN-9RgZFdXfEJKZeQsL4hM4H8bqs5_c" alt="Robot technician repairing a broken laptop computer">
        </div>
        
        <div class="error-code">404</div>
        <h1>System Malfunction</h1>
        <p>Our repair bot is currently working overtime on this missing page. The URL might be incorrect or the content has been relocated.</p>

        <div class="btn-group">
            <a href="/" class="btn btn-primary">Return Home</a>
            <button onclick="history.back()" class="btn btn-secondary">Go Back</button>
        </div>
    </main>

</body>
</html>
